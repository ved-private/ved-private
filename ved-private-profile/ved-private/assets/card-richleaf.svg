<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" width="360" height="290" role="img" aria-label="RichLeaf: a budget and expense tracker">
<defs>
<style>
text{white-space:pre}
.sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.sheen{animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%,55%{transform:translateX(-420px)}85%,100%{transform:translateX(420px)}}
.pulse{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.5)}}
.cta{animation:cta 2.4s ease-in-out infinite}
@keyframes cta{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
</style>
<linearGradient id="rl-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b0a10"/><stop offset="1" stop-color="#08030a"/></linearGradient>
<radialGradient id="rl-glow" cx=".85" cy=".08" r=".7"><stop offset="0" stop-color="#4ade80" stop-opacity=".30"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/></radialGradient>
<linearGradient id="rl-bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset=".55" stop-color="#4a0710"/><stop offset="1" stop-color="#ff1e3c"/></linearGradient>
<linearGradient id="rl-ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
<linearGradient id="rl-sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="rl-clip"><rect x="1.5" y="1.5" width="357" height="287" rx="20"/></clipPath>
<linearGradient id="rl-ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
</defs>
<rect x="1.5" y="1.5" width="357" height="287" rx="20" fill="url(#rl-bg)"/>
<g clip-path="url(#rl-clip)">
<rect width="360" height="290" fill="url(#rl-glow)"/>
<g class="sheen"><path d="M150 0H210L120 290H60Z" fill="url(#rl-sh)"/></g>
<rect x="0" y="286" width="360" height="4" fill="#ff1e3c" opacity=".85"/>
<!-- header -->
<circle cx="40" cy="40" r="19" fill="url(#rl-ic)"/>
<g transform="translate(40 40)" fill="#fff"><path d="M0 -11C11 -8 13 4 0 11C-13 4 -11 -8 0 -11Z"/><path d="M0 -6V9" stroke="#16a34a" stroke-width="1.6" fill="none"/></g>
<text class="sans" x="68" y="47" font-size="23" font-weight="800" fill="#fff">RichLeaf</text>
<rect x="248" y="26" width="92" height="25" rx="12.5" fill="#35e08a" fill-opacity=".12" stroke="#35e08a" stroke-opacity=".6"/>
<circle class="pulse" cx="262" cy="38.5" r="3.4" fill="#35e08a"/>
<text class="mono" x="270" y="43" font-size="11" font-weight="700" fill="#35e08a">LIVE</text>
<!-- illustration frame -->
<rect x="18" y="68" width="324" height="128" rx="14" fill="#fff" fill-opacity=".03" stroke="#4ade80" stroke-opacity=".28"/>
<circle cx="86" cy="134" r="34" fill="none" stroke="#17301f" stroke-width="13"/><g transform="rotate(-90 86 134)"><circle cx="86" cy="134" r="34" fill="none" stroke="url(#rl-ic)" stroke-width="13" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6"><animate attributeName="stroke-dashoffset" values="213.6;213.6;68.4;68.4;213.6" keyTimes="0;.04;.4;.92;1" dur="8s" repeatCount="indefinite"/></circle></g><text class="sans" x="86" y="135" font-size="17" font-weight="800" text-anchor="middle" fill="#fff">68%</text><text class="mono" x="86" y="148" font-size="8.5" text-anchor="middle" fill="#7fb592">spent</text><g><animateTransform attributeName="transform" type="translate" values="0 -26;0 -26;0 6;0 6" keyTimes="0;.0;.5;1" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.5 0 1 .6;0 0 1 1"/><g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.08;.42;.52;1" dur="2.4s" repeatCount="indefinite"/><circle cx="86" cy="94" r="8" fill="#ffd166" stroke="#b8860b" stroke-width="1.2"/><text class="sans" x="86" y="98" font-size="10" font-weight="800" text-anchor="middle" fill="#7a5200">₹</text></g></g><text class="mono" x="152" y="109" font-size="10.5" fill="#a6cbb2">Food</text><rect x="206" y="100" width="112" height="11" rx="5.5" fill="#17301f"/><rect x="206" y="100" width="112" height="11" rx="5.5" fill="#4ade80" style="transform-box:fill-box;transform-origin:left"><animateTransform attributeName="transform" type="scale" values="0 1;0 1;0.78 1;0.78 1;0 1" keyTimes="0;0.06;0.36;.92;1" dur="8s" repeatCount="indefinite"/></rect><text class="mono" x="152" y="139" font-size="10.5" fill="#a6cbb2">Travel</text><rect x="206" y="130" width="112" height="11" rx="5.5" fill="#17301f"/><rect x="206" y="130" width="112" height="11" rx="5.5" fill="#22c55e" style="transform-box:fill-box;transform-origin:left"><animateTransform attributeName="transform" type="scale" values="0 1;0 1;0.52 1;0.52 1;0 1" keyTimes="0;0.12;0.42;.92;1" dur="8s" repeatCount="indefinite"/></rect><text class="mono" x="152" y="169" font-size="10.5" fill="#a6cbb2">Bills</text><rect x="206" y="160" width="112" height="11" rx="5.5" fill="#17301f"/><rect x="206" y="160" width="112" height="11" rx="5.5" fill="#16a34a" style="transform-box:fill-box;transform-origin:left"><animateTransform attributeName="transform" type="scale" values="0 1;0 1;0.34 1;0.34 1;0 1" keyTimes="0;0.18;0.48;.92;1" dur="8s" repeatCount="indefinite"/></rect><g opacity="0"><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.42;.5;.62" dur="8s" repeatCount="indefinite"/><path d="M118 112c7 -2 11 3 9 9c-6 2 -11 -3 -9 -9Z" fill="#4ade80"/></g>
<!-- copy -->
<text class="sans" x="20" y="220" font-size="13.2" fill="#d9bcc2">Set budgets, log every spend,</text>
<text class="sans" x="20" y="238" font-size="13.2" fill="#d9bcc2">see exactly where the money goes.</text>
<rect x="20" y="248" width="62.4" height="22" rx="11" fill="#4ade80" fill-opacity=".10" stroke="#4ade80" stroke-opacity=".55"/><text class="mono" x="51.2" y="263" font-size="11" text-anchor="middle" fill="#f3dde0">Budget</text><rect x="90.4" y="248" width="114.2" height="22" rx="11" fill="#4ade80" fill-opacity=".10" stroke="#4ade80" stroke-opacity=".55"/><text class="mono" x="147.5" y="263" font-size="11" text-anchor="middle" fill="#f3dde0">Offline-first</text><rect x="212.6" y="248" width="69.8" height="22" rx="11" fill="#4ade80" fill-opacity=".10" stroke="#4ade80" stroke-opacity=".55"/><text class="mono" x="247.5" y="263" font-size="11" text-anchor="middle" fill="#f3dde0">Reports</text>

</g>
<rect x="1.5" y="1.5" width="357" height="287" rx="20" fill="none" stroke="url(#rl-bd)" stroke-width="2"/>
</svg>