<rect width="360" height="290" fill="url(#sap-glow)"/>
<g class="sheen"><path d="M150 0H210L120 290H60Z" fill="url(#sap-sh)"/></g>
<rect x="0" y="286" width="360" height="4" fill="#ff1e3c" opacity=".85"/>
