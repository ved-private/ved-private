<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" width="360" height="290" role="img" aria-label="SAPclub: a learning platform and community for SAP students">
<defs>
<style>
text{white-space:pre}
.sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.sheen{animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%,55%{transform:translateX(-420px)}85%,100%{transform:translateX(420px)}}
.pulse{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.5)}}
.cta{animation:cta 2.4s ease-in-out infinite}
@keyframes cta{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
</style>
<linearGradient id="sap-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b0a10"/><stop offset="1" stop-color="#08030a"/></linearGradient>
<radialGradient id="sap-glow" cx=".85" cy=".08" r=".7"><stop offset="0" stop-color="#2f8bff" stop-opacity=".30"/><stop offset="1" stop-color="#2f8bff" stop-opacity="0"/></radialGradient>
<linearGradient id="sap-bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f8bff"/><stop offset=".55" stop-color="#4a0710"/><stop offset="1" stop-color="#ff1e3c"/></linearGradient>
<linearGradient id="sap-ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f8bff"/><stop offset="1" stop-color="#00c2ff"/></linearGradient>
<linearGradient id="sap-sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="sap-clip"><rect x="1.5" y="1.5" width="357" height="287" rx="20"/></clipPath>
<linearGradient id="sap-line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f8bff"/><stop offset="1" stop-color="#00c2ff"/></linearGradient><linearGradient id="sap-ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f8bff"/><stop offset="1" stop-color="#00c2ff"/></linearGradient>
</defs>
