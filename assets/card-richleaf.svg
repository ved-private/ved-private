<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" role="img" aria-label="RichLeaf: a budget and expense tracker">
<defs>
<style>
text{white-space:pre}
.sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.sheen{animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%,55%{transform:translateX(-420px)}85%,100%{transform:translateX(420px)}}
.pulse{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.5)}}
</style>
<linearGradient id="rl-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0509"/><stop offset="1" stop-color="#09030a"/></linearGradient>
<radialGradient id="rl-glow" cx=".88" cy=".06" r=".75"><stop offset="0" stop-color="#ff1e3c" stop-opacity=".18"/><stop offset="1" stop-color="#ff1e3c" stop-opacity="0"/></radialGradient>
<linearGradient id="rl-bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4d5e"/><stop offset=".55" stop-color="#4a0710"/><stop offset="1" stop-color="#ff1e3c"/></linearGradient>
<linearGradient id="rl-ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5a6a"/><stop offset="1" stop-color="#c4102a"/></linearGradient>
<linearGradient id="rl-ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5a6a"/><stop offset="1" stop-color="#ff1e3c"/></linearGradient>
<linearGradient id="rl-sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="rl-clip"><rect x="1.5" y="1.5" width="357" height="297" rx="16"/></clipPath>
</defs>
<rect x="1.5" y="1.5" width="357" height="297" rx="16" fill="url(#rl-bg)"/>
<g clip-path="url(#rl-clip)">
<rect width="360" height="300" fill="url(#rl-glow)"/>
<g class="sheen"><path d="M150 0H210L120 300H60Z" fill="url(#rl-sh)"/></g>
<rect x="0" y="296" width="360" height="4" fill="#ff1e3c" opacity=".85"/>
<circle cx="42" cy="42" r="20" fill="url(#rl-ic)"/>
<g transform="translate(42 42)" fill="#fff"><path d="M0 -11C11 -8 13 4 0 11C-13 4 -11 -8 0 -11Z"/><path d="M0 -6V9" stroke="#c4102a" stroke-width="1.6" fill="none"/></g>
<text class="sans" x="74" y="50" font-size="24" font-weight="800" fill="#fff">RichLeaf</text>
<rect x="246" y="29" width="96" height="26" rx="13" fill="#ff1e3c" fill-opacity=".12" stroke="#ff1e3c" stroke-opacity=".6"/>
<circle class="pulse" cx="261" cy="42" r="3.6" fill="#ff1e3c"/>
<text class="mono" x="271" y="46.5" font-size="12" font-weight="700" fill="#ff6b7b">LIVE</text>
<rect x="18" y="76" width="324" height="132" rx="12" fill="#fff" fill-opacity=".03" stroke="#ff1e3c" stroke-opacity=".28"/>
<circle cx="84" cy="142" r="34" fill="none" stroke="#3a0f17" stroke-width="13"/><g transform="rotate(-90 84 142)"><circle cx="84" cy="142" r="34" fill="none" stroke="url(#rl-ln)" stroke-width="13" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6"><animate attributeName="stroke-dashoffset" values="213.6;213.6;68.4;68.4;213.6" keyTimes="0;.04;.4;.92;1" dur="8s" repeatCount="indefinite"/></circle></g>
<text class="sans" x="84" y="143" font-size="19" font-weight="800" text-anchor="middle" fill="#fff">68%</text><text class="mono" x="84" y="157" font-size="10" text-anchor="middle" fill="#d08a94">spent</text>
<g><animateTransform attributeName="transform" type="translate" values="0 -26;0 -26;0 6;0 6" keyTimes="0;.0;.5;1" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.5 0 1 .6;0 0 1 1"/><g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.08;.42;.52;1" dur="2.4s" repeatCount="indefinite"/><circle cx="84" cy="104" r="9" fill="#ffd9de" stroke="#ff8a97" stroke-width="1.4"/><text class="sans" x="84" y="108" font-size="11" font-weight="800" text-anchor="middle" fill="#8d0f1c">₹</text></g></g>
<text class="mono" x="142" y="114" font-size="12" fill="#e0b3ba">Food</text><rect x="204" y="104" width="114" height="12" rx="6" fill="#2d0a10"/><rect x="204" y="104" width="114" height="12" rx="6" fill="#ff5a6a" style="transform-box:fill-box;transform-origin:left"><animateTransform attributeName="transform" type="scale" values="0 1;0 1;0.78 1;0.78 1;0 1" keyTimes="0;0.06;0.36;.92;1" dur="8s" repeatCount="indefinite"/></rect>
<text class="mono" x="142" y="144" font-size="12" fill="#e0b3ba">Travel</text><rect x="204" y="134" width="114" height="12" rx="6" fill="#2d0a10"/><rect x="204" y="134" width="114" height="12" rx="6" fill="#ff1e3c" style="transform-box:fill-box;transform-origin:left"><animateTransform attributeName="transform" type="scale" values="0 1;0 1;0.52 1;0.52 1;0 1" keyTimes="0;0.12;0.42;.92;1" dur="8s" repeatCount="indefinite"/></rect>
<text class="mono" x="142" y="174" font-size="12" fill="#e0b3ba">Bills</text><rect x="204" y="164" width="114" height="12" rx="6" fill="#2d0a10"/><rect x="204" y="164" width="114" height="12" rx="6" fill="#c4102a" style="transform-box:fill-box;transform-origin:left"><animateTransform attributeName="transform" type="scale" values="0 1;0 1;0.34 1;0.34 1;0 1" keyTimes="0;0.18;0.48;.92;1" dur="8s" repeatCount="indefinite"/></rect>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.42;.5;.62" dur="8s" repeatCount="indefinite"/><path d="M118 120c7 -2 11 3 9 9c-6 2 -11 -3 -9 -9Z" fill="#ff8a97"/></g>
<text class="sans" x="20" y="234" font-size="15" fill="#e8ccd1">Set budgets. Log every spend.</text>
<text class="sans" x="20" y="254" font-size="15" fill="#e8ccd1">See where the money goes.</text>
<rect x="20" y="266" width="67.6" height="26" rx="13" fill="#ff1e3c" fill-opacity=".10" stroke="#ff1e3c" stroke-opacity=".55"/><text class="mono" x="53.8" y="283.5" font-size="12.5" text-anchor="middle" fill="#f3dde0">Budget</text>
<rect x="95.6" y="266" width="120.8" height="26" rx="13" fill="#ff1e3c" fill-opacity=".10" stroke="#ff1e3c" stroke-opacity=".55"/><text class="mono" x="156.0" y="283.5" font-size="12.5" text-anchor="middle" fill="#f3dde0">Offline-first</text>
<rect x="224.4" y="266" width="75.2" height="26" rx="13" fill="#ff1e3c" fill-opacity=".10" stroke="#ff1e3c" stroke-opacity=".55"/><text class="mono" x="262.0" y="283.5" font-size="12.5" text-anchor="middle" fill="#f3dde0">Reports</text>
</g>
<rect x="1.5" y="1.5" width="357" height="297" rx="16" fill="none" stroke="url(#rl-bd)" stroke-width="2"/>
</svg>
