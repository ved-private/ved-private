<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 96" width="1000" height="96" role="img" aria-label="Also built: Nagrik, a civic issue tracker, and CampusHub, an RBU campus platform">
<defs><style>
text{white-space:pre}
.sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.sheen{animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%,55%{transform:translateX(-420px)}85%,100%{transform:translateX(420px)}}
.pulse{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.5)}}
</style>
<linearGradient id="m-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0509"/><stop offset="1" stop-color="#09030a"/></linearGradient>
<linearGradient id="m-bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4d5e"/><stop offset=".55" stop-color="#4a0710"/><stop offset="1" stop-color="#ff1e3c"/></linearGradient>
<linearGradient id="m-ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5a6a"/><stop offset="1" stop-color="#c4102a"/></linearGradient></defs>
<g transform="translate(0 0)">
<rect x="1" y="1" width="486" height="94" rx="14" fill="url(#m-bg)" stroke="url(#m-bd)" stroke-width="2"/>
<circle cx="46" cy="48" r="22" fill="url(#m-ic)"/>
<g transform="translate(46 48)" fill="#fff"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="1.3s" repeatCount="indefinite"/><path d="M0 -11C7 -11 11 -6 11 -1C11 6 0 13 0 13C0 13 -11 6 -11 -1C-11 -6 -7 -11 0 -11Z"/><circle cx="0" cy="-2" r="3.6" fill="#c4102a"/></g></g>
<text class="sans" x="84" y="40" font-size="22" font-weight="800" fill="#fff">Nagrik</text>
<text class="sans" x="84" y="62" font-size="14.5" fill="#e8ccd1">Report potholes, garbage &amp; dead lights</text>
<text class="mono" x="84" y="82" font-size="12" fill="#ff6b7b">photo + map pin · React · Firebase · Leaflet</text></g>
<g transform="translate(512 0)">
<rect x="1" y="1" width="486" height="94" rx="14" fill="url(#m-bg)" stroke="url(#m-bd)" stroke-width="2"/>
<circle cx="46" cy="48" r="22" fill="url(#m-ic)"/>
<g transform="translate(46 48)" fill="#fff"><path d="M-11 11V-2L0 -11L11 -2V11Z"/><rect x="-3" y="2" width="6" height="9" fill="#c4102a"/></g>
<text class="sans" x="84" y="40" font-size="22" font-weight="800" fill="#fff">CampusHub</text>
<text class="sans" x="84" y="62" font-size="14.5" fill="#e8ccd1">RBU Nagpur campus platform, team project</text>
<text class="mono" x="84" y="82" font-size="12" fill="#ff6b7b">I built the frontend · Next.js · Tailwind · shadcn</text></g>
