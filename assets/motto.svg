<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Build. Learn. Ship.">
<defs><style>.sl{animation:sl linear infinite}@keyframes sl{from{transform:translateX(1100px)}to{transform:translateX(-450px)}}text{white-space:pre}.h{opacity:0;animation-duration:7s;animation-iteration-count:infinite;animation-timing-function:steps(1,end)}.h0{animation-name:a0}.h1{animation-name:a1}.h2{animation-name:a2}@keyframes a0{0%,25%{opacity:1}28%,75%{opacity:0}78%,93%{opacity:1}96%,100%{opacity:0}}@keyframes a1{0%,24%{opacity:0}27%,50%{opacity:1}53%,75%{opacity:0}78%,93%{opacity:1}96%,100%{opacity:0}}@keyframes a2{0%,50%{opacity:0}53%,93%{opacity:1}96%,100%{opacity:0}}.cur{animation:cu 1s steps(1) infinite}@keyframes cu{50%{opacity:0}}</style>
<linearGradient id="hf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#ff4d5e"/><stop offset="1" stop-color="#ff1e3c"/></linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff1e3c"/><stop offset=".5" stop-color="#4a0710"/><stop offset="1" stop-color="#ff1e3c"/></linearGradient>
<filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#2a0b10" stroke-width="1"/></pattern>
<clipPath id="card"><rect x="1" y="1" width="998" height="248" rx="22"/></clipPath></defs>
<rect width="1000" height="250" rx="22" fill="#0a0406"/>
<g clip-path="url(#card)"><rect width="1000" height="250" fill="url(#grid)" opacity=".7"/>
<rect class="sl" x="0" y="206.8" width="205" height="1.5" rx="1" fill="#ffffff" opacity="0.26" style="animation-duration:0.78s;animation-delay:-0.11s"/><rect class="sl" x="0" y="221.7" width="187" height="2" rx="1" fill="#ffffff" opacity="0.35" style="animation-duration:0.80s;animation-delay:-0.48s"/><rect class="sl" x="0" y="59.1" width="164" height="1" rx="1" fill="#ffffff" opacity="0.35" style="animation-duration:0.46s;animation-delay:-0.41s"/><rect class="sl" x="0" y="39.6" width="156" height="1" rx="1" fill="#ffffff" opacity="0.18" style="animation-duration:0.79s;animation-delay:-0.63s"/><rect class="sl" x="0" y="21.8" width="178" height="2" rx="1" fill="#ffd2d6" opacity="0.18" style="animation-duration:0.97s;animation-delay:-0.11s"/><rect class="sl" x="0" y="231.3" width="212" height="1" rx="1" fill="#ffffff" opacity="0.35" style="animation-duration:0.46s;animation-delay:-0.32s"/><rect class="sl" x="0" y="34.8" width="177" height="1" rx="1" fill="#ffd2d6" opacity="0.35" style="animation-duration:0.78s;animation-delay:-0.37s"/><rect class="sl" x="0" y="58.6" width="239" height="1.5" rx="1" fill="#ffd2d6" opacity="0.35" style="animation-duration:0.52s;animation-delay:-0.49s"/>
<text x="170" y="152" text-anchor="middle" textLength="290" lengthAdjust="spacingAndGlyphs" style="font-family:Impact,Haettenschweiler,'Arial Black',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:92px;font-weight:900" fill="#12060a" stroke="#ff1e3c" stroke-opacity=".38" stroke-width="1.6">BUILD.</text><text x="500" y="152" text-anchor="middle" textLength="290" lengthAdjust="spacingAndGlyphs" style="font-family:Impact,Haettenschweiler,'Arial Black',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:92px;font-weight:900" fill="#12060a" stroke="#ff1e3c" stroke-opacity=".38" stroke-width="1.6">LEARN.</text><text x="830" y="152" text-anchor="middle" textLength="235" lengthAdjust="spacingAndGlyphs" style="font-family:Impact,Haettenschweiler,'Arial Black',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:92px;font-weight:900" fill="#12060a" stroke="#ff1e3c" stroke-opacity=".38" stroke-width="1.6">SHIP.</text><g class="h h0"><text x="170" y="152" text-anchor="middle" textLength="290" lengthAdjust="spacingAndGlyphs" style="font-family:Impact,Haettenschweiler,'Arial Black',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:92px;font-weight:900" fill="url(#hf)" filter="url(#glow)">BUILD.</text></g><g class="h h1"><text x="500" y="152" text-anchor="middle" textLength="290" lengthAdjust="spacingAndGlyphs" style="font-family:Impact,Haettenschweiler,'Arial Black',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:92px;font-weight:900" fill="url(#hf)" filter="url(#glow)">LEARN.</text></g><g class="h h2"><text x="830" y="152" text-anchor="middle" textLength="235" lengthAdjust="spacingAndGlyphs" style="font-family:Impact,Haettenschweiler,'Arial Black',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:92px;font-weight:900" fill="url(#hf)" filter="url(#glow)">SHIP.</text></g>
<rect y="176" height="5" rx="2.5" fill="#ff1e3c" filter="url(#glow)">
<animate attributeName="x" values="40;370;700;65;65;65;65" keyTimes="0;.26;.52;.77;.94;.96;1" calcMode="discrete" dur="7s" repeatCount="indefinite"/>
<animate attributeName="width" values="260;260;260;870;870;870;870" keyTimes="0;.26;.52;.77;.94;.96;1" calcMode="discrete" dur="7s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;1;1;1;1;0;0" keyTimes="0;.26;.52;.77;.94;.96;1" calcMode="discrete" dur="7s" repeatCount="indefinite"/></rect>
<text x="500" y="222" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;fill:#8a6169">while (alive) { build(); learn(); ship(); }<tspan class="cur" fill="#ff1e3c">▌</tspan></text>
</g>
<rect x="1" y="1" width="998" height="248" rx="22" fill="none" stroke="url(#bd)" stroke-opacity=".8" stroke-width="2"/></svg>