<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" role="img" aria-label="FlightWise: flight price comparison and booking advisor">
<defs>
<style>
text{white-space:pre}
.sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.sheen{animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%,55%{transform:translateX(-420px)}85%,100%{transform:translateX(420px)}}
.pulse{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.5)}}
</style>
<linearGradient id="fw-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0509"/><stop offset="1" stop-color="#09030a"/></linearGradient>
<radialGradient id="fw-glow" cx=".88" cy=".06" r=".75"><stop offset="0" stop-color="#ff1e3c" stop-opacity=".18"/><stop offset="1" stop-color="#ff1e3c" stop-opacity="0"/></radialGradient>
<linearGradient id="fw-bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4d5e"/><stop offset=".55" stop-color="#4a0710"/><stop offset="1" stop-color="#ff1e3c"/></linearGradient>
<linearGradient id="fw-ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5a6a"/><stop offset="1" stop-color="#c4102a"/></linearGradient>
<linearGradient id="fw-ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5a6a"/><stop offset="1" stop-color="#ff1e3c"/></linearGradient>
<linearGradient id="fw-sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="fw-clip"><rect x="1.5" y="1.5" width="357" height="297" rx="16"/></clipPath>
</defs>
<rect x="1.5" y="1.5" width="357" height="297" rx="16" fill="url(#fw-bg)"/>
<g clip-path="url(#fw-clip)">
<rect width="360" height="300" fill="url(#fw-glow)"/>
<g class="sheen"><path d="M150 0H210L120 300H60Z" fill="url(#fw-sh)"/></g>
<rect x="0" y="296" width="360" height="4" fill="#ff1e3c" opacity=".85"/>
<circle cx="42" cy="42" r="20" fill="url(#fw-ic)"/>
<g transform="translate(42 42)" fill="#fff"><path d="M-12 2L-2 0L-6 -10L-3 -10L5 -1L12 -3C14.5 -3 14.5 2.5 12 2.5L5 1.2L-3 11L-6 11L-2 2.2Z" transform="rotate(-18)"/></g>
<text class="sans" x="74" y="50" font-size="24" font-weight="800" fill="#fff">FlightWise</text>
<rect x="246" y="29" width="96" height="26" rx="13" fill="#ff1e3c" fill-opacity=".12" stroke="#ff1e3c" stroke-opacity=".6"/>
<circle class="pulse" cx="261" cy="42" r="3.6" fill="#ff1e3c"/>
<text class="mono" x="271" y="46.5" font-size="12" font-weight="700" fill="#ff6b7b">PYTHON</text>
<rect x="18" y="76" width="324" height="132" rx="12" fill="#fff" fill-opacity=".03" stroke="#ff1e3c" stroke-opacity=".28"/>
<path d="M40 166Q92 94 144 166" fill="none" stroke="#4a1019" stroke-width="2.4" stroke-dasharray="3 5"/><path d="M40 166Q92 94 144 166" fill="none" stroke="url(#fw-ln)" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="130" stroke-dashoffset="130"><animate attributeName="stroke-dashoffset" values="130;0;0;130" keyTimes="0;.55;.9;1" dur="5s" repeatCount="indefinite"/></path>
<circle cx="40" cy="166" r="5" fill="#ff1e3c"/><circle cx="144" cy="166" r="5" fill="#ff1e3c"/><text class="mono" x="40" y="188" font-size="12" font-weight="700" text-anchor="middle" fill="#ffb3bc">DEL</text><text class="mono" x="144" y="188" font-size="12" font-weight="700" text-anchor="middle" fill="#ffb3bc">BOM</text>
<g><animateMotion dur="5s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;1" keyTimes="0;.55;1" calcMode="linear" path="M40 166Q92 94 144 166"/><path d="M-9 0L-3 -1.4L-6 -8L-3.4 -8L2 -1.8L8 -3C10 -3 10 3 8 3L2 1.8L-3.4 8L-6 8L-3 1.4Z" fill="#fff" stroke="#ff1e3c" stroke-width=".8"/></g>
<text class="mono" x="168" y="122" font-size="12" fill="#ffd0d6">IndiGo</text><rect x="238" y="112" width="94" height="12" rx="6" fill="#2d0a10"/><rect x="238" y="112" width="94" height="12" rx="6" fill="url(#fw-ln)" style="transform-box:fill-box;transform-origin:left"><animateTransform attributeName="transform" type="scale" values="0.647 1;0.588 1;0.647 1;0.647 1" keyTimes="0;.33;.66;1" dur="5s" repeatCount="indefinite"/></rect>
<text class="mono" x="168" y="150" font-size="12" fill="#c99aa2">Vistara</text><rect x="238" y="140" width="94" height="12" rx="6" fill="#2d0a10"/><rect x="238" y="140" width="94" height="12" rx="6" fill="#6a2a33" style="transform-box:fill-box;transform-origin:left"><animateTransform attributeName="transform" type="scale" values="0.843 1;0.902 1;0.843 1;0.843 1" keyTimes="0;.33;.66;1" dur="5s" repeatCount="indefinite"/></rect>
<text class="mono" x="168" y="178" font-size="12" fill="#c99aa2">Air India</text><rect x="238" y="168" width="94" height="12" rx="6" fill="#2d0a10"/><rect x="238" y="168" width="94" height="12" rx="6" fill="#6a2a33" style="transform-box:fill-box;transform-origin:left"><animateTransform attributeName="transform" type="scale" values="0.98 1;0.922 1;0.98 1;0.98 1" keyTimes="0;.33;.66;1" dur="5s" repeatCount="indefinite"/></rect>
<g><rect x="252" y="86" width="80" height="19" rx="9.5" fill="#ff1e3c"><animate attributeName="opacity" values="1;.6;1" dur="1.6s" repeatCount="indefinite"/></rect><text class="mono" x="292" y="99.5" font-size="11" font-weight="800" text-anchor="middle" fill="#fff">cheapest</text></g>
<text class="sans" x="20" y="234" font-size="15" fill="#e8ccd1">Compare fares across airlines,</text>
<text class="sans" x="20" y="254" font-size="15" fill="#e8ccd1">find the best time to book.</text>
<rect x="20" y="266" width="67.6" height="26" rx="13" fill="#ff1e3c" fill-opacity=".10" stroke="#ff1e3c" stroke-opacity=".55"/><text class="mono" x="53.8" y="283.5" font-size="12.5" text-anchor="middle" fill="#f3dde0">Python</text>
<rect x="95.6" y="266" width="67.6" height="26" rx="13" fill="#ff1e3c" fill-opacity=".10" stroke="#ff1e3c" stroke-opacity=".55"/><text class="mono" x="129.4" y="283.5" font-size="12.5" text-anchor="middle" fill="#f3dde0">Pandas</text>
<rect x="171.2" y="266" width="90.4" height="26" rx="13" fill="#ff1e3c" fill-opacity=".10" stroke="#ff1e3c" stroke-opacity=".55"/><text class="mono" x="216.4" y="283.5" font-size="12.5" text-anchor="middle" fill="#f3dde0">Streamlit</text>
</g>
<rect x="1.5" y="1.5" width="357" height="297" rx="16" fill="none" stroke="url(#fw-bd)" stroke-width="2"/>
</svg>
