<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-label="Build. Learn. Ship.">
<defs><style>
text{white-space:pre}
.sans{font-family:'Arial Black','Helvetica Neue',Impact,'Segoe UI',Arial,sans-serif;font-weight:900}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace}
.r0,.r1,.r2{animation:fall linear infinite}
.r0{animation-duration:.6s}.r1{animation-duration:.78s}.r2{animation-duration:.95s}
@keyframes fall{from{transform:translate(0,-60px)}to{transform:translate(-80px,560px)}}
.g{transform-box:fill-box;transform-origin:50% 100%;animation:sway ease-in-out infinite alternate}
.g0{animation-duration:1.5s}.g1{animation-duration:1.9s}.g2{animation-duration:2.3s}.g3{animation-duration:2.8s}
@keyframes sway{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.sp{opacity:0;animation:sp .9s ease-out infinite}
@keyframes sp{0%{opacity:0;transform:scale(.4)}25%{opacity:.9}100%{opacity:0;transform:scale(1.6)}}
.st0{animation:tw 3.2s ease-in-out infinite}.st1{animation:tw 4.1s ease-in-out -1.3s infinite}.st2{animation:tw 2.6s ease-in-out -.7s infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}

.cur{animation:cur 1s steps(2,end) infinite}@keyframes cur{0%{opacity:1}50%{opacity:0}}
.gl{opacity:0;animation:gl 5s infinite}
@keyframes gl{0%,92%,100%{opacity:0;transform:translate(0,0)}93%{opacity:.9;transform:translate(5px,-1px)}94%{opacity:0}95%{opacity:.8;transform:translate(-5px,1px)}97%{opacity:0}}
</style><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs>
<rect width="1000" height="350" fill="#0a0204"/>
<rect x="14" y="16" width="972" height="88" fill="#0a0204" stroke="#f3dde0" stroke-width="3"/>
<text class="sans" x="34" y="84" font-size="76" letter-spacing="-2" fill="none" stroke="#f3dde0" stroke-width="2">BUILD.</text>
<text class="mono" x="966" y="54" font-size="16" font-weight="700" text-anchor="end" fill="#b3949a">IDEA → PROTOTYPE</text><text class="mono" x="966" y="78" font-size="14" text-anchor="end" fill="#7d5d63">NO TUTORIAL HELL</text>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="1;0;0" keyTimes="0;.3333;1" dur="9s" repeatCount="indefinite"/><rect x="14" y="16" width="972" height="88" fill="#ff1e3c"/><text class="sans" x="34" y="84" font-size="76" letter-spacing="-2" fill="#0a0204">BUILD.</text><text class="mono" x="966" y="54" font-size="16" font-weight="700" text-anchor="end" fill="#0a0204">IDEA → PROTOTYPE</text><text class="mono" x="966" y="78" font-size="14" text-anchor="end" fill="#0a0204">NO TUTORIAL HELL</text></g><rect x="14" y="116" width="972" height="88" fill="#0a0204" stroke="#f3dde0" stroke-width="3"/>
<text class="sans" x="34" y="184" font-size="76" letter-spacing="-2" fill="none" stroke="#f3dde0" stroke-width="2">LEARN.</text>
<text class="mono" x="966" y="154" font-size="16" font-weight="700" text-anchor="end" fill="#b3949a">LABS · CERTS · DOCS</text><text class="mono" x="966" y="178" font-size="14" text-anchor="end" fill="#7d5d63">FUNDAMENTALS FIRST</text>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;.3333;.6666;1" dur="9s" repeatCount="indefinite"/><rect x="14" y="116" width="972" height="88" fill="#ff1e3c"/><text class="sans" x="34" y="184" font-size="76" letter-spacing="-2" fill="#0a0204">LEARN.</text><text class="mono" x="966" y="154" font-size="16" font-weight="700" text-anchor="end" fill="#0a0204">LABS · CERTS · DOCS</text><text class="mono" x="966" y="178" font-size="14" text-anchor="end" fill="#0a0204">FUNDAMENTALS FIRST</text></g><rect x="14" y="216" width="972" height="88" fill="#0a0204" stroke="#f3dde0" stroke-width="3"/>
<text class="sans" x="34" y="284" font-size="76" letter-spacing="-2" fill="none" stroke="#f3dde0" stroke-width="2">SHIP.</text>
<text class="mono" x="966" y="254" font-size="16" font-weight="700" text-anchor="end" fill="#b3949a">LIVE LINKS ONLY</text><text class="mono" x="966" y="278" font-size="14" text-anchor="end" fill="#7d5d63">IF IT ISN'T DEPLOYED, IT ISN'T DONE</text>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1" keyTimes="0;.6666;1" dur="9s" repeatCount="indefinite"/><rect x="14" y="216" width="972" height="88" fill="#ff1e3c"/><text class="sans" x="34" y="284" font-size="76" letter-spacing="-2" fill="#0a0204">SHIP.</text><text class="mono" x="966" y="254" font-size="16" font-weight="700" text-anchor="end" fill="#0a0204">LIVE LINKS ONLY</text><text class="mono" x="966" y="278" font-size="14" text-anchor="end" fill="#0a0204">IF IT ISN'T DEPLOYED, IT ISN'T DONE</text></g>
<text class="mono" x="20" y="336" font-size="15" fill="#ff4d5e">while (alive) { build(); learn(); ship(); }</text><rect class="cur" x="404" y="324" width="9" height="15" fill="#ff1e3c"/>
<rect width="1000" height="350" filter="url(#grain)" opacity=".08"/>
<rect x="3" y="3" width="994" height="344" fill="none" stroke="#ff1e3c" stroke-width="6"/>
</svg>